<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Screen</title>
    <link rel="stylesheet" href="/styles/style.css">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <header>
        <a href="/homescreen.html" class="back-button">
            <i class="fa fa-arrow-left"></i>
        </a>
        <h2>ALL ENTRIES</h2>
        <div></div>
    </header>
    <div class="container">
    <div class="profile-header">
      <img src="https://via.placeholder.com/100" alt="User Avatar" class="avatar" id="userAvatar">
      <div class="user-info">
        <h2 id="userName">User Name</h2>
        <p id="userEmail">user@example.com</p>
        <p id="joinDate">Joined on Jan 1, 2024</p>
      </div>
    </div>

    <div class="edit-form" id="editForm">
      <input type="text" id="editName" placeholder="Enter new name">
      <input type="email" id="editEmail" placeholder="Enter new email">
      <button class="btn save-btn" onclick="saveProfile()">Save Changes</button>
    </div>

    <div class="stats">
      <div class="stat">
        <h3 id="entryCount">0</h3>
        <span>Entries</span>
      </div>
      <div class="stat">
        <h3 id="photoCount">0</h3>
        <span>Photos</span>
      </div>
      <div class="stat">
        <h3 id="placeCount">0</h3>
        <span>Countries</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn edit-btn" onclick="toggleEditForm()">Edit Profile</button>
      <button class="btn logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

    <footer>
    <div class="footer-item">
            <i class="fa fa-home"></i>
            <p><a href="/homescreen.html">HOME</a></p>
        </div>
        <div class="footer-item">
            <i class="fa fa-suitcase"></i>
            <p><a href="/pricing.html">TRIPS</a></p>
        </div>
        <div class="footer-item">
            <i class="fa fa-plus-circle"></i>
            <p><a href="/newentry.html">NEW ENTRY</a></p>
        </div>
    </footer>
    <script src="/scripts/profile.js"></script>
</body>
</html>
