<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Screen</title>
    <link rel="stylesheet" href="/styles/profile.css">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <header>
        <a href="/homescreen.html" class="back-button">
            <i class="fa fa-arrow-left"></i>
        </a>
        <h2>MY PROFILE</h2>
        
            <a href="/upgrade.html">Upgrade</a>
        </div>
    </header>
    <div class="profile-info">
            <div class="image-container">
                <label class="profile-pic" id="file-input">
                    <img id="profileImg" class="profile-img">
                    <img src="/images/camera icon.png" alt="Camera Icon" class="camera-icon">
                    <input type="file" id="file-input">
                </label>
            </div>
        </div>
    <div class="container">
        
        <div>
      <div class="user-info">
        <p id="userName"></p>
        <p id="userEmail"></p>
        <p id="joinDate"></p>
      </div>
    </div>

    <div class="actions">
      <button class="btn edit-btn" id="editProfile">Edit Profile</button>
      <button class="btn logout-btn" id="logoutBtn">Logout</button>
    </div>
  </div>
  <!-- Modal -->
<div id="editProfileModal" class="modal hidden">
  <div class="modal-content">
    <h2>Edit Profile</h2>
    <form id="editProfileForm">
      <label for="editName">Name:
      <input type="text" id="editName" required /></label>

      <label for="editEmail">Email:
      <input type="email" id="editEmail" required /></label>

      <button type="submit" class="btn green">Save Changes</button>
      <button type="button" class="btn" id="cancelEdit">Cancel</button>
    </form>
  </div>
   <div id="actionMessage" class="hidden">
  <p id="messageText"></p>
</div>

</div>

    <footer>
    <div class="footer-item">
            <i class="fa fa-home"></i>
            <p><a href="/homescreen.html">HOME</a></p>
        </div>
        <div class="footer-item">
            <i class="fa fa-plus-circle"></i>
            <p><a href="/newentry.html">NEW ENTRY</a></p>
        </div>
        <div class="footer-item">
            <i class="fa fa-check-circle"></i>
            <p><a href="/upgrade.html">UPGRADE</a></p>
        </div>
        
    </footer>
    <script src="/scripts/profile.js" type="module"></script>
</body>
</html>
