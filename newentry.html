<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Entry Screen</title>
    <link rel="stylesheet" href="/styles/newentry.css">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
   <header>
        <a href="/homescreen.html" class="back-button">
            <i class="fa fa-arrow-left"></i>
        </a>
        <h2>NEW ENTRY</h2>
        <div></div>
    </header>
    <main>
        <form id="newEntryForm">
            <label for="title">Title
                <input type="text" id="title" placeholder="Give your adventure a title..." class="title" required>
            </label>
            <label for="date"><i class="fa fa-calendar-o"></i>Date
                <input type="date" placeholder="" id="date" required>
            </label>
             <label for="place"><img src="/images/location icon.png" alt="Location Icon" class="location-icon">Place visited
                <input type="text" id="place" placeholder="Santorini, Greece" class="place" required>
            </label>
            <label for="story">Your Story
                <textarea placeholder="Share your thoughts, experiences and memories" id="story" class="story" required></textarea>
            </label>
            <div class="input-container">
                <div class="input-item">
                    <img src="/images/album icon.png" alt="Album Icon" class="album-icon">
                <p>Photos/Videos</p>
                </div>
            <div class="upload-box" id="uploadBox">
            <i class="fa fa-camera"></i>
            <input type="file" id="images" accept="image/*" style="display: none" multiple/>
            </div>
                </label>
            </div>
           <div id="imagePreviewContainer" class="preview-container"></div>
            </div>
            <!-- Loading message (initially hidden) -->
<div id="uploadingMessage" class="hidden">Uploading your journal entry...</div>
            <button class="publish-btn">Publish</button>
        </form>
         <div id="actionMessage" class="hidden">
  <p id="messageText"></p>
</div>

    </main>
    <footer>
        <div class="footer-item">
            <i class="fa fa-home"></i>
            <p><a href="/homescreen.html">HOME</a></p>
        </div>
        <div class="footer-item">
            <i class="fa fa-plus-circle"></i>
            <p><a href="/newentry.html">NEW ENTRY</a></p>
        </div>
        <div class="footer-item">
            <i class="fa fa-check-circle"></i>
            <p><a href="/upgrade.html">UPGRADE</a></p>
        </div>
    </footer>
    <script src="/scripts/uploadjournal.js" type="module"></script>
    <script src="/scripts/newentry.js"></script>
</body>
</html>
