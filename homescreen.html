<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Screen</title>
    <link rel="stylesheet" href="/styles/homescreen.css">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
        <header>
        <section class="profile">
            <a href="/profile.html"><img src="/images/ema.jpg" alt="Profile Picture" class="profile-pic">
            </a>
            <div class="profile-info">
                <p class="Greeting">Welcome</p>
                <p class="profile-name" id="profile-name">
                    <span id="loggedUserFName"></span>
                    <span id="loggedUserLName"></span>
                </p>
        </section>
    </header>
    <main>
        <!-- Modal Structure -->
<div id="welcomeModal" class="modal hidden">
  <div class="modal-content">
    <h2>Welcome to <span class="brand">Miles and Memories</span></h2>
    <p>Your personal travel journal — document your experiences from every journey.</p>
    <button id="closeModalBtn">Start Documenting</button>
  </div>
</div>
       <section>
        <div class="grid-container">
            <div class="grid-item box-1">
                <i class="fa fa-plus-circle"></i>
                <a href="/newentry.html">
                New Entry
            </a>
            </div>
            <div class="grid-item box-2">
                <i class="fa fa-folder-open"></i>
                <a href="/entries.html">
                All Entries
            </a>
            </div>
            <div class="grid-item box-3" id="entriesBox">
                <span id="entriesCount" class="btn">0</span>
                <span>Entries</span>
            </div>
            <div class="grid-item box-4" id="photosBox">
                <span id="photosCount" class="btn">0</span>
                <span> Photos</span>
            </div>
            <div class="grid-item box-5" id="placesBox">
                <span id="placesCount" class="btn">0</span>
                <span>cities</span>
            </div>
        </div>
       </section>
       <section class="entry-section">
        <h2>RECENT ENTRIES</h2>
        <div class="entry-container" id="entryContainer">
            
        </div>
       </section>
    </main> 
    <footer>
        <div class="footer-item">
            <i class="fa fa-home"></i>
            <p><a href="/homescreen.html">HOME</a></p>
        </div>
        <div class="footer-item">
            <i class="fa fa-plus-circle"></i>
            <p><a href="/newentry.html">NEW ENTRY</a></p>
        </div>
        <div class="footer-item">
            <i class="fa fa-check-circle"></i>
            <p><a href="/upgrade.html">UPGRADE</a></p>
        </div>
    </footer>
    <script src="/scripts/homescreen.js" type="module"></script>
</body>
</html>
